name: snapswap
description: "SnapSwap - Εφαρμογή ανταλλαγής αντικειμένων"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  image_picker: ^1.0.5
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  permission_handler: ^11.1.0
  flutter_card_swiper: ^6.0.0
  cached_network_image: ^3.3.1
  intl: ^0.18.1
  uuid: ^4.2.2
  path: ^1.9.0
  sqflite_common_ffi_web: ^0.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
